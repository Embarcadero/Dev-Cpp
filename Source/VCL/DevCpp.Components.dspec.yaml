# DPM package spec - Dev-C++ IDE components
# (TDevFileMonitor, TDevShortcuts, TCompOptionsList)
# Same units as Source\VCL\DevCpp.dpk.
#
# Package projects live in packages\RAD Studio <ver>\ and are maintained with
#   dpm prepare DevCpp.Components.dspec.yaml
min dpm client version: 1.0.0
metadata:
  id: DevCpp.Components
  version: 6.3.0
  description: Dev-C++ file monitor, shortcut manager and compiler option list VCL components.
  authors:
    - Bloodshed Software
    - Dev-C++ contributors
  projectUrl: https://github.com/Embarcadero/Dev-Cpp
  repositoryUrl: https://github.com/Embarcadero/Dev-Cpp
  license: GPL-2.0-or-later
  tags:
    - devcpp
    - vcl
  frameworks:
    - vcl
# devcpp.exe is Win32-only and these units guard their uses clauses with
# {$IFDEF WIN32}, so Win64 is not offered.
targetPlatforms:
  - compiler: delphi11.0
    platforms: [win32]
    variables:
      packageFolder: RAD Studio 11.0
  - compiler: delphi12.0
    platforms: [win32]
    variables:
      packageFolder: RAD Studio 12.0
  - compiler: delphi13.0
    platforms: [win32]
    variables:
      packageFolder: RAD Studio 13.0
templates:
  - name: default
    source:
      - src: ./devFileMonitor/*.pas
        dest: devFileMonitor
      - src: ./devFileMonitor/*.dcr
        dest: devFileMonitor
      - src: ./devShortcuts/*.pas
        dest: devShortcuts
      - src: ./devShortcuts/*.dfm
        dest: devShortcuts
      - src: ./devShortcuts/*.dcr
        dest: devShortcuts
      - src: ./CompOptionsList/*.pas
        dest: CompOptionsList
      # GPL v2 text from the repository root
      - src: ../../LICENSE
        dest: licenses
      # DPM only puts lib\<platform> on a consuming project's search path, so
      # forms the units link with {$R *.dfm} must also sit beside the .dcu files.
      - src: ./devShortcuts/*.dfm
        dest: lib/Win32
      - src: ./packages/$packageFolder$/*
        dest: packages/$packageFolder$
    build:
      - project: ./packages/$packageFolder$/DevCpp.ComponentsR.dproj
    # The component units carry their own Register procedures, so the
    # design package contains the units rather than requiring the runtime one.
    design:
      - project: ./packages/$packageFolder$/DevCpp.ComponentsD.dproj
        platforms: [win32]
